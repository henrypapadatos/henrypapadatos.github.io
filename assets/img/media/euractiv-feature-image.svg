<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#grad1)"/>
  
  <!-- Abstract data visualization -->
  <rect x="30" y="120" width="15" height="60" fill="url(#grad2)" opacity="0.7"/>
  <rect x="60" y="100" width="15" height="80" fill="url(#grad2)" opacity="0.8"/>
  <rect x="90" y="80" width="15" height="100" fill="url(#grad2)" opacity="0.6"/>
  <rect x="120" y="90" width="15" height="90" fill="url(#grad2)" opacity="0.9"/>
  <rect x="150" y="70" width="15" height="110" fill="url(#grad2)" opacity="0.7"/>
  <rect x="180" y="110" width="15" height="70" fill="url(#grad2)" opacity="0.8"/>
  <rect x="210" y="130" width="15" height="50" fill="url(#grad2)" opacity="0.6"/>
  <rect x="240" y="95" width="15" height="85" fill="url(#grad2)" opacity="0.7"/>
  
  <!-- Chart title -->
  <text x="150" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" opacity="0.9">AI Company Risk Assessment</text>
  
  <!-- Legend -->
  <text x="150" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" opacity="0.8">Risk Management Performance</text>
</svg>