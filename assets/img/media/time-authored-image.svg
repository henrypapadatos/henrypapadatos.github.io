<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#grad1)"/>
  
  <!-- Abstract global connectivity -->
  <circle cx="150" cy="100" r="40" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="100" r="25" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
  <circle cx="150" cy="100" r="10" fill="white" opacity="0.9"/>
  
  <!-- Global nodes -->
  <circle cx="80" cy="60" r="8" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="220" cy="70" r="8" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="60" cy="140" r="8" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="240" cy="130" r="8" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="150" cy="40" r="8" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="150" cy="160" r="8" fill="url(#grad2)" opacity="0.8"/>
  
  <!-- Connecting lines to center -->
  <line x1="80" y1="60" x2="130" y2="85" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="70" x2="170" y2="85" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="140" x2="130" y2="115" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="130" x2="170" y2="115" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="40" x2="150" y2="75" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="160" x2="150" y2="125" stroke="white" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Title text -->
  <text x="150" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" opacity="0.9">Global AI Standards</text>
</svg>