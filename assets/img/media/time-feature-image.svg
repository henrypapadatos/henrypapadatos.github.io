<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#274663;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#647d99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#grad1)"/>
  
  <!-- Abstract AI risk visualization -->
  <circle cx="50" cy="50" r="20" fill="url(#grad2)" opacity="0.7"/>
  <circle cx="150" cy="80" r="25" fill="url(#grad2)" opacity="0.5"/>
  <circle cx="250" cy="60" r="18" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="100" cy="150" r="22" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="200" cy="140" r="20" fill="url(#grad2)" opacity="0.7"/>
  
  <!-- Connecting lines -->
  <line x1="50" y1="50" x2="150" y2="80" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="150" y1="80" x2="250" y2="60" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="150" x2="200" y2="140" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="150" y1="80" x2="100" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- AI Risk Management text overlay -->
  <text x="150" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" opacity="0.8">AI Risk Management</text>
</svg>